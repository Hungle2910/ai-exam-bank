name: Main promotion

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions: {}

jobs:
  promotion-source:
    name: Promotion source
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REPO: ${{ github.repository }}
    steps:
      - name: Require the protected dev branch
        shell: bash
        run: |
          if [[ "$HEAD_REF" != "dev" || "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "Only a pull request from this repository's protected dev branch may target main."
            exit 1
          fi
      - name: Require the tested dev commit
        shell: bash
        run: |
          tested_sha="$(
            jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" |
              sed -nE 's/^- Exact `dev` commit SHA tested:[[:space:]]*([0-9a-f]{40})[[:space:]]*$/\1/p'
          )"
          if [[ "$tested_sha" != "$HEAD_SHA" ]]; then
            echo "Declare the current dev HEAD as the tested commit in the promotion PR."
            exit 1
          fi
